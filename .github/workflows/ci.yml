
name: CICD

on:
  push:
    branches: [advance]

  pull_request:
    branches: [advance]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Step 2: Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run lint
      - name: Run lint
        run: npm run lint

      # Step 5: Run tests
      - name: Run tests
        run: npm test

      # Step 6: Build frontend
      - name: Build frontend
        run: npm run build
